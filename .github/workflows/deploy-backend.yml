name: Deploy backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/deploy.sh'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: # adds a manual "Run workflow" button

permissions:
  id-token: write   # needed to request the OIDC token
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  INSTANCE_ID: i-06a9da21b23222537
  ROLE_ARN: arn:aws:iam::770272510916:role/realestateai-github-deploy-role
  API_URL: https://13-204-88-163.sslip.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get temporary AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy on EC2 via SSM Run Command
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub deploy ${GITHUB_SHA::7}" \
            --parameters 'commands=["runuser -l ubuntu -c \"cd /home/ubuntu/app && git fetch -q origin main && git reset -q --hard origin/main && bash scripts/deploy.sh\""]' \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}" --output json

          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          echo "Final status: $STATUS"
          test "$STATUS" = "Success"

      - name: Public health check
        run: curl -fsS --retry 5 --retry-delay 3 "$API_URL/api/properties" | head -c 120